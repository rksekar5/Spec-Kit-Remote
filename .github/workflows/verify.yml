name: Verify feature and Spec Kit

on:
  push:
    branches: [main, 001-task-search]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    name: Application tests and virtual demo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run acceptance and legacy regression tests
        shell: bash
        run: |
          mkdir -p work/evidence
          set -o pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee work/evidence/tests.log
      - name: Run virtual CLI demo
        shell: bash
        run: |
          set -o pipefail
          bash scripts/demo.sh 2>&1 | tee work/evidence/demo.log
      - name: Upload application evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-evidence
          path: work/evidence/
          retention-days: 14

  spec-kit:
    name: Spec Kit CLI smoke and artifact audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the exact Spec Kit source used for development
        run: python -m pip install 'git+https://github.com/github/spec-kit.git@0226ff65b9d670d55fb06334e659866f0f3b53b9'
      - name: Execute Spec Kit shell commands in an isolated copy
        shell: bash
        run: |
          mkdir -p work/evidence
          set -o pipefail
          bash scripts/spec-kit-smoke.sh 2>&1 | tee work/evidence/spec-kit-shell.log
      - name: Audit committed workflow artifacts
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/audit-spec-kit.py 2>&1 | tee work/evidence/spec-kit-audit.log
      - name: Explain the evidence boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## What this run verifies
          - Runs application acceptance tests and a real CLI demo.
          - Installs pinned Spec Kit and runs its CLI/template/prerequisite scripts.
          - Checks committed specifications, completed tasks, checklists and installed skill files.

          **This is not a replay of the nine Codex agent skills.** Those were applied in the
          development chat. A new CI run cannot independently prove that historical execution.
          Autonomous specify/plan/implement/converge needs a configured model runner and credentials.
          No model invocation or credentials are used by this workflow.
          SUMMARY
      - name: Upload Spec Kit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-kit-evidence
          path: work/evidence/
          retention-days: 14
